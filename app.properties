# =============================================================
#  app.properties — Single source of truth for app configuration
#
#  HOW TO USE:
#    Edit the values below, then rebuild the project.
#    Gradle automatically injects everything into the right place.
#    You NEVER need to edit build.gradle.kts, strings.xml, or
#    colors.xml manually for these values.
#
#  ICON:
#    To change the icon artwork, replace the vector paths in
#    app/src/main/res/drawable/ic_launcher_foreground.xml
#    The fill color is controlled by app.color.primary below.
# =============================================================

# ─── App Identity ────────────────────────────────────────────
app.name             = Call Recorder
app.id               = com.callrecorder.app

# ─── Versioning ──────────────────────────────────────────────
#  version.code : integer, incremented for every Play Store release
#  version.name : human-readable string shown in Settings & Play Store
app.version.code     = 1
app.version.name     = 1.1.0

# ─── Brand Colors ────────────────────────────────────────────
#  primary  : icon foreground tint, buttons, FAB, accent elements 
#  dark.bg  : icon background, splash screen bg, dark-mode surface
#  light.bg : light-mode surface / background
app.color.primary    = #1EA7AF
app.color.dark.bg    = #021F31
app.color.light.bg   = #FFFFFF
